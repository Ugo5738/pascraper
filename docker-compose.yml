services:
  web:
    container_name: analysis-scraper-app
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        daphne pascraper.asgi:application -b 0.0.0.0 -p 8001
      "
    volumes:
      - .:/code
    ports:
      - '8001:8001'
    depends_on:
      - redis
    networks:
      - default

  redis:
    container_name: analysis-scraper-app-redis
    image: redis:latest
    networks:
      - default

  celery:
    container_name: analysis-scraper-app-celery
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        echo 'Waiting for analysis-scraper-app and redis...';
        while ! nc -z analysis-scraper-app 8001 || ! nc -z redis 6379; do
          sleep 1;
        done;
        echo 'Web and Redis are up - starting celery worker';
        celery -A pascraper worker --loglevel=info -Q scraper_queue
      "
    volumes:
      - .:/code
    depends_on:
      - redis
    networks:
      - default
    
networks:
  default:
    external:
      name: shared_network
